services:
  - type: web
    name: multidownloader
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: META_OEMBED_TOKEN
        sync: false
      # Descarga (opcionales)
      - key: YTDLP_COOKIES_B64
        sync: false
      - key: YTDLP_PROXY
        sync: false
      - key: COBALT_API_URL
        sync: false
      - key: COBALT_API_KEY
        sync: false
      - key: DOWNLOAD_ENGINE
        value: ytdlp
