it;font-size:17px;font-weight:500;cursor:pointer;text-decoration:none;transition:background .2s,transform .2s}.go:hover{background:#d4d4d4;transform:translateY(-1px)}\n.go.g{background:none;color:var(--t);border:1px solid #404040;margin-top:10px}.go.g:hover{background:#171717}\n.bar{position:relative;overflow:hidden;height:6px;border-radius:6px;background:#1c1c1c;margin:16px 0}.bar i{display:block;height:100%;width:0;background:#fff;border-radius:6px;transition:width .2s}\n.bar::after{content:\"\";position:absolute;inset:0;width:40%;background:linear-gradient(90deg,transparent,#fff5,transparent);animation:sl 1.1s linear infinite}@keyframes sl{from{transform:translateX(-100%)}to{transform:translateX(350%)}}\n.sp{display:inline-block;width:16px;height:16px;border:2px solid #333;border-top-color:#fff;border-radius:50%;animation:r .7s linear infinite}@keyframes r{to{transform:rotate(1turn)}}\n.hide{display:none!important}.nm{min-width:0;flex:1}.nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}\n:focus-visible{outline:2px solid #fff;outline-offset:3px}\n@media(prefers-reduced-motion:reduce){.tile,.go{transition:none}.bar::after,.sp{animation:none}}\n<\/style>\n<script defer src=\"https://cdn.jsdelivr.net/npm/mp4box@0.5.2/dist/mp4box.all.min.js\"><\/script>\n<script defer src=\"https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.js\"><\/script>\n<\/head><body><main>\n<svg width=\"0\" height=\"0\" style=\"position:absolute\" aria-hidden=\"true\"><defs>\n<symbol id=\"i-up\" viewBox=\"0 0 24 24\"><path d=\"M12 16V4M7 9l5-5 5 5M4 20h16\"/><\/symbol>\n<symbol id=\"i-spark\" viewBox=\"0 0 24 24\"><path d=\"M12 3l2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z\"/><\/symbol>\n<symbol id=\"i-pct\" viewBox=\"0 0 24 24\"><path d=\"M19 5L5 19\"/><circle cx=\"7\" cy=\"7\" r=\"2.5\"/><circle cx=\"17\" cy=\"17\" r=\"2.5\"/><\/symbol>\n<symbol id=\"i-sl\" viewBox=\"0 0 24 24\"><path d=\"M4 6h8M18 6h2M4 12h2M12 12h8M4 18h10M20 18h0\ <label class=\"card\" style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer\"><span class=\"l\" style=\"color:var(--t)\"><svg class=\"i\"><use href=\"#i-vol\"/><\/svg>Mantener siempre el audio<\/span><input type=\"checkbox\" id=\"ka\" checked><\/label>\n<div class=\"card\" id=\"sum\"><\/div>\n<button class=\"go\" id=\"go\"><svg class=\"i\"><use href=\"#i-play\"/><\/svg>Comprimir<\/button>\n<\/div>\n<div class=\"card hide\" id=\"prog\"><div class=\"tt\"><span class=\"sp\"><\/span>&nbsp; Comprimiendo <b id=\"pp\">0 %<\/b><\/div><div class=\"bar\"><i id=\"pb\"><\/i><\/div><div id=\"pe\" class=\"spec\" style=\"margin:0 0 16px\"><\/div><button class=\"go g\" id=\"cn\" style=\"margin:0\"><svg class=\"i\"><use href=\"#i-x\"/><\/svg>Cancelar<\/button><\/div>\n<div class=\"card hide\" id=\"done\"><\/div>\n<div class=\"card hide\" id=\"err\" style=\"color:var(--m)\"><\/div>\n<\/main>\n<script>\nconst $=s=>document.querySelector(s),MB=1048576,even=n=>Math.max(2,Math.round(n/2)*2);\nconst ic=n=>`<svg class=\"i\"><use href=\"#i-${n}\"/><\/svg>`;\nconst fmt=b=>b>=1073741824?(b/1073741824).toFixed(2)+' GB':(b/MB).toFixed(b>=1e8?0:1)+' MB';\nconst dt=s=>{s=Math.round(s);const h=s/3600|0,m=s%3600/60|0;return(h?h+' h ':'')+m+' min '+s%60+' s'};\nlet F,M,MK,KA=true,mode='rec',pct=50,stop=0,C={res:0,fps:0,codec:'avc',vb:1000,ab:128,mono:false,hw:'prefer-hardware'};\nfunction plan(tb,fps=30){\n const tot=tb*8/M.d*.985,ab=Math.max(KA?32e3:0,tot>7e5?128e3:tot>4e5?96e3:tot>2e5?64e3:tot>1e5?40e3:0),vb=Math.max(tot-ab,8e3),sh=Math.min(M.w,M.h);\n let f=fps>31&&vb/(M.w*M.h*fps)>=.08?fps:Math.min(fps,30),res=0;\n const L=[2160,1440,1080,720,480,360,240,144].filter(x=>x<sh),bp=x=>vb/(M.w*M.h*(x/sh)**2*f);\n if(bp(sh)<.07&&L.length){res=L.find(x=>bp(x)>=.07)||L.find(x=>x<=480&&bp(x)>=.04)||L[L.length-1];const b=bp(res);if(b<.045)f=Math.min(f,24);if(b<.03)f=Math.min(f,15)}\n return{vb,ab,res,fps:f,codec:'avc',mono:ab<=64e3,hw:'prefer-hardware'}}\nfunction c <script type="text/babel">
const { useState, useEffect } = React;
// Si el frontend está en otro dominio que el backend, define window.MULTIDOWNLOADER_API = "https://tu-servidor" antes de este script
const API = (window.MULTIDOWNLOADER_API || "").replace(/\/+$/, "");

const Icon = ({ id, size = 40 }) => {
  const p = { width: size, height: size, viewBox: "0 0 40 40", fill: "none", stroke: "currentColor", strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round", "aria-hidden": true };
  if (id === "youtube") return <svg {...p}><rect x="4" y="9" width="32" height="22" rx="7"/><path d="M17 15l8 5-8 5z" fill="currentColor"/></svg>;
  if (id === "instagram") return <svg {...p}><rect x="6" y="6" width="28" height="28" rx="9"/><circle cx="20" cy="20" r="6.5"/><circle cx="28.5" cy="11.5" r="1" fill="currentColor"/></svg>;
  if (id === "tiktok") return <svg {...p}><path d="M22 7v18.5a5.5 5.5 0 1 1-5.5-5.5"/><path d="M22 7c.5 4 3 6.5 7.500 7"/></svg>;
  if (id === "comprimir") return <svg {...p}><path d="M8 15h8V7M32 15h-8V7M8 25h8v8M32 25h-8v8"/></svg>;
  if (id === "suno") return <svg {...p}><path d="M8 17v6M14 11v18M20 6v28M26 13v14M32 17v6"/></svg>;
  return <svg {...p}><circle cx="20" cy="20" r="14" strokeDasharray="3 5"/><path d="M20 13v14M13 20h14"/></svg>;
};

const PLATFORMS = [
  { id: "youtube", name: "YouTube", title: "Vídeos y audio de YouTube y YouTube Music", hint: "https://www.youtube.com/watch?v=…" },
  { id: "instagram", name: "Instagram", title: "Reels, vídeos e imágenes de Instagram", hint: "https://www.instagram.com/reel/…" },
  { id: "tiktok", name: "TikTok", title: "Vídeos de TikTok", hint: "https://www.tiktok.com/@usuario/video/…" },
  { id: "suno", name: "Suno AI", title: "Canciones de Suno AI", hint: "https://suno.com/song/…" },
  { id: "otros", name: "Otros", title: "Enlaces de cualquier otra app", hint: "https://… (pega el enlace de cualquier otra app)" },
];

// ---- Servidor: comprobar si está despierto (Render gratis se duerme) ----
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const noBackend = !API && (location.protocol === "file:" || location.hostname.endsWith("github.io"));
async function pingServer() {
  try {
    const r = await fetch(`${API}/api/platforms`, { cache: "no-store", signal: AbortSignal.timeout(8000) });
    if (!r.ok) return false;
    await r.json();            // si devuelve HTML (página de "arrancando"), esto falla
    return true;
  } catch { return false; }
}
async function waitForServer(isAlive, maxMs = 150000) {
  const t0 = Date.now();
  while (isAlive() && Date.now() - t0 < maxMs) {
    if (await pingServer()) return true;
    await sleep(3000);
  }
  return false;
}

const NO_BACKEND_MSG = "Esta web se abre desde GitHub Pages o un archivo local, que no tienen backend. Edita la línea window.MULTIDOWNLOADER_API al principio del index.html con la URL de tu servidor de Render, o abre la web desde esa URL.";
async function ensureServer(isAlive, onWake) {
  if (await pingServer()) return true;
  onWake();
  return waitForServer(isAlive);
}
const nameFromResponse = (r, fallback) => {
  const cd = r.headers.get("content-disposition") || "";
  const star = cd.match(/filename\*=UTF-8''([^;]+)/i);
  if (star) { try { return decodeURIComponent(star[1]); } catch {} }
  const plain = cd.match(/filename="?([^";]+)"?/i);
  return plain ? plain[1] : fallback;
};
const fmtTime = (ms) => { if (!ms) return ""; const s = Math.round(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };

// ---- Instalar como app (PC y móvil) ----
const isStandalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const useInstall = () => {
  const [evt, setEvt] = useState(null);
  const [installed, setInstalled] = useState(isStandalone());
  useEffect(() => {
    const onPrompt = (e) => { e.preventDefault(); setEvt(e); };
    const onInstalled = () => { setEvt(null); setInstalled(true); };
    addEventListener("beforeinstallprompt", onPrompt);
    addEventListener("appinstalled", onInstalled);
    return () => { removeEventListener("beforeinstallprompt", onPrompt); removeEventListener("appinstalled", onInstalled); };
  }, []);
  const install = async () => { if (!evt) return; evt.prompt(); try { await evt.userChoice; } catch {} setEvt(null); };
  return { canInstall: !installed && Boolean(evt), iosHint: !installed && isIOS && !evt, install };
};

const useRoute = () => {
  const [r, setR] = useState(location.hash.slice(1));
  useEffect(() => { const f = () => setR(location.hash.slice(1)); addEventListener("hashchange", f); return () => removeEventListener("hashchange", f); }, []);
  return r;
};

function Home({ app }) {
  return (
    <main className="mx-auto max-w-5xl px-5 pt-8 pb-20 sm:pt-12">
      <div className="flex min-h-[2.5rem] items-center justify-end">
        {app.canInstall && <button type="button" onClick={app.install} className="btn rounded-full border border-neutral-800 px-4 py-2 text-sm text-neutral-300 hover:bg-neutral-900">Instalar app</button>}
        {app.iosHint && <p className="text-sm text-neutral-500">Para instalarla: Compartir → Añadir a pantalla de inicio</p>}
      </div>
      <div className="h-8 sm:h-14"></div>
      <h1 className="text-5xl sm:text-7xl font-bold tracking-tight leading-[0.95]">MultiDownloader</h1>
      <p className="mt-5 max-w-md text-lg text-neutral-400">Pega un enlace, mira qué hay y descarga lo que la plataforma te permita.</p>
      <div className="mt-14 grid grid-cols-1 sm:grid-cols-2 gap-4">
        {PLATFORMS.filter(p => p.id !== "otros").map(p => (
          <a key={p.id} href={"#" + p.id} className="tile group flex items-center gap-5 rounded-3xl border border-neutral-800 bg-[#0e0e0e] p-7 sm:p-9">
            <span className="text-white"><Icon id={p.id} size={44} /></span>
            <span className="text-2xl font-medium">{p.name}</span>
          </a>
        ))}
        <a href="#comprimir" className="tile flex items-center gap-5 rounded-3xl border border-neutral-800 bg-[#0e0e0e] p-7 sm:p-9">
          <span className="text-white"><Icon id="comprimir" size={44} /></span>
          <span><span className="block text-2xl font-medium">Comprimir vídeo</span><span className="text-sm text-neutral-400">Reduce su peso sin subir nada</span></span>
        </a>
        <a href="#otros" className="tile flex items-center gap-5 rounded-3xl border border-dashed border-neutral-700 bg-[#0e0e0e] p-7 sm:p-9">
          <span className="text-white"><Icon id="otros" size={44} /></span>
          <span><span className="block text-2xl font-medium">Otros</span><span className="text-sm text-neutral-400">Pega el enlace de cualquier otra app o web</span></span>
        </a>
      </div>
    </main>
  );
}

function Platform({ p }) {
  const [url, setUrl] = useState("");
  const [state, setState] = useState("idle");
  const [data, setData] = useState(null);
  const [err, setErr] = useState("");
  const [secs, setSecs] = useState(0);
  const alive = React.useRef(true);
  useEffect(() => { alive.current = true; return () => { alive.current = false; }; }, []);
  useEffect(() => {
    if (state !== "waking") return;
    setSecs(0);
    const t = setInterval(() => setSecs(x => x + 1), 1000);
    return () => clearInterval(t);
  }, [state]);

  const [dlj, setDlj] = useState(null);   // descarga en curso: { phase: preparing|downloading|done|error, ... }
  const ctrl = React.useRef(null);
  useEffect(() => () => ctrl.current?.abort(), []);   // si sales de la pantalla, se cancela
  useEffect(() => {
    if (dlj?.phase !== "preparing") return;
    const t = setInterval(() => setDlj(d => (d && d.phase === "preparing" ? { ...d, secs: d.secs + 1 } : d)), 1000);
    return () => clearInterval(t);
  }, [dlj?.phase]);
  const busy = dlj && (dlj.phase === "preparing" || dlj.phase === "downloading");

  const fail = (m) => { if (alive.current) { setErr(m); setState("error"); } };

  const analyze = async (e) => {
    e.preventDefault();
    if (!url.trim()) { fail("Pega un enlace para analizarlo."); return; }
    if (noBackend) { fail("Esta web se abre desde GitHub Pages o un archivo local, que no tienen backend. Edita la línea window.MULTIDOWNLOADER_API al principio del index.html con la URL de tu servidor de Render (p. ej. https://multidownloader.onrender.com), o abre la web desde esa URL."); return; }
    ctrl.current?.abort(); setDlj(null);
    setData(null); setErr(""); setState("loading");
    try {
      // 1) ¿Está despierto el servidor? Si no, esperamos hasta que responda
      if (!(await pingServer())) {
        if (!alive.current) return;
        setState("waking");
        const ok = await waitForServer(() => alive.current);
        if (!alive.current) return;
        if (!ok) { fail(`El servidor no responde (probé ${(API || location.origin)}/api/platforms). Abre esa dirección en el navegador y revisa en Render → Logs que el despliegue no haya fallado.`); return; }
        setState("loading");
      }
      // 2) Servidor listo: analizamos el enlace
      const r = await fetch(`${API}/api/${p.id}/analyze`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ url }), signal: AbortSignal.timeout(120000) });
      const raw = await r.text();
      let j;
      try { j = JSON.parse(raw); } catch { throw new Error("El servidor respondió algo inesperado. Inténtalo de nuevo en unos segundos."); }
      if (!r.ok) throw new Error(j.error || "No se pudo analizar el enlace.");
      if (!alive.current) return;
      setData(j); setState("done");
    } catch (x) {
      fail(x.name === "TimeoutError" ? "El análisis tardó demasiado. Inténtalo de nuevo." : x.name === "TypeError" ? "No se pudo conectar con el servidor." : x.message);
    }
  };

  const fileName = (r, fallback) => {
    const cd = r.headers.get("content-disposition") || "";
    const star = cd.match(/filename\*=UTF-8''([^;]+)/i);
    if (star) { try { return decodeURIComponent(star[1]); } catch {} }
    const plain = cd.match(/filename="?([^";]+)"?/i);
    return plain ? plain[1] : fallback;
  };
  const mb = (n) => (n / 1048576).toFixed(1);

  const startDownload = async (f) => {
    if (busy) return;
    const ac = new AbortController(); ctrl.current = ac;
    setDlj({ phase: "preparing", label: f.label, secs: 0 });
    try {
      const r = await fetch(dl(f), { signal: ac.signal });   // tarda mientras el servidor prepara el archivo
      if (!r.ok) {
        let m = "No se pudo descargar el archivo.";
        try { m = (await r.json()).error || m; } catch {}
        throw new Error(m);
      }
      const total = Number(r.headers.get("content-length")) || 0;
      const reader = r.body.getReader(), chunks = [];
      let received = 0, last = 0;
      setDlj({ phase: "downloading", label: f.label, received: 0, total });
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value); received += value.length;
        if (Date.now() - last > 150) { last = Date.now(); setDlj({ phase: "downloading", label: f.label, received, total }); }
      }
      const blob = new Blob(chunks, { type: r.headers.get("content-type") || "application/octet-stream" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = fileName(r, f.type === "audio" ? "audio.mp3" : "video.mp4");
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 60000);
      setDlj({ phase: "done", label: f.label });
    } catch (x) {
      if (x.name === "AbortError") { setDlj(null); return; }
      setDlj({ phase: "error", msg: x.name === "TypeError" ? "Se perdió la conexión con el servidor." : x.message });
    }
  };

  const fmts = (t) => (data?.formats || []).filter(f => f.type === t);
  const dl = (f) => `${API}/api/${p.id}/download?url=${encodeURIComponent(url)}&type=${f.type}&quality=${encodeURIComponent(f.quality || "")}`;

  return (
    <main className="mx-auto max-w-2xl px-5 pt-8 pb-20">
      <div className="flex justify-end"><a href="#" className="btn inline-block rounded-full border border-neutral-800 px-4 py-2 text-sm text-neutral-300 hover:bg-neutral-900">Volver</a></div>
      <div className="mt-12 text-white"><Icon id={p.id} size={52} /></div>
      <h1 className="mt-5 text-3xl sm:text-4xl font-bold tracking-tight">{p.title}</h1>
      <form onSubmit={analyze} className="mt-8 flex flex-col sm:flex-row gap-3">
        <input value={url} onChange={e => setUrl(e.target.value)} placeholder={p.hint} inputMode="url" autoComplete="off" aria-label="Enlace del contenido"
          className="min-w-0 flex-1 rounded-2xl border border-neutral-800 bg-[#0e0e0e] px-5 py-4 text-base placeholder-neutral-600" />
        <button className="btn rounded-2xl bg-white px-7 py-4 font-medium text-black hover:bg-neutral-300" disabled={state === "loading" || state === "waking"}>Analizar enlace</button>
      </form>

      {state === "waking" && (
        <div className="mt-8 rounded-2xl border border-neutral-800 bg-[#0e0e0e] p-5" role="status" aria-live="polite">
          <div className="bar h-1.5 rounded-full"></div>
          <p className="mt-3 text-neutral-200">Encendiendo el servidor… <span className="text-neutral-500">{secs} s</span></p>
          <p className="mt-1 text-sm text-neutral-500">Está en un plan gratuito y se apaga si nadie lo usa. Puede tardar hasta un minuto; en cuanto esté listo, analizo tu enlace automáticamente.</p>
        </div>
      )}
      {state === "loading" && <div className="mt-8" role="status"><div className="bar h-1.5 rounded-full"></div><p className="mt-3 text-sm text-neutral-500">Analizando enlace…</p></div>}
      {state === "error" && <p role="alert" className="mt-8 rounded-2xl border border-neutral-700 bg-[#101010] p-5 text-neutral-200">{err}</p>}

      {state === "done" && data && (
        <section className="mt-8 overflow-hidden rounded-3xl border border-neutral-800 bg-[#0e0e0e]">
          {data.thumbnail && <img src={data.thumbnail} alt="" className="aspect-video w-full object-cover" referrerPolicy="no-referrer" />}
          <div className="p-6">
            <h2 className="text-xl font-medium leading-snug">{data.title}</h2>
            <p className="mt-1 text-sm text-neutral-500">{[data.author, data.duration].filter(Boolean).join(" · ")}</p>

            {data.formats.length === 0 ? (
              <p className="mt-6 rounded-2xl bg-[#171717] p-4 text-sm text-neutral-400">
                {data.downloads ? "Este contenido no ofrece formatos descargables." : "Este servidor solo lee los datos públicos del enlace. La descarga se activa conectando un proveedor autorizado (ver README)."}
              </p>
            ) : (
              <div className="mt-6 space-y-5">
                {[["video", "Descargar vídeo (con audio)"], ["audio", "Descargar audio"]].map(([t, label]) => fmts(t).length > 0 && (
                  <div key={t}>
                    <h3 className="mb-2 text-sm text-neutral-400">{label}</h3>
                    <div className="flex flex-wrap gap-2">
                      {fmts(t).map(f => <button key={f.type + f.quality} type="button" onClick={() => startDownload(f)} disabled={busy} className="btn rounded-full border border-neutral-700 px-5 py-2.5 enabled:hover:bg-white enabled:hover:text-black disabled:opacity-40 disabled:cursor-not-allowed">{f.label}</button>)}
                    </div>
                  </div>
                ))}
              </div>
            )}

            {dlj && (
              <div className="mt-6 rounded-2xl bg-[#171717] p-4" role="status" aria-live="polite">
                {dlj.phase === "preparing" && (<>
                  <div className="bar h-1.5 rounded-full"></div>
                  <p className="mt-3 text-sm text-neutral-200">Preparando {dlj.label}… <span className="text-neutral-500">{dlj.secs} s</span></p>
                  <p className="mt-1 text-xs text-neutral-500">El servidor está procesando el archivo. No hace falta pulsar otra vez: la descarga empezará sola.</p>
                </>)}
                {dlj.phase === "downloading" && (<>
                  {dlj.total ? (
                    <div className="h-1.5 overflow-hidden rounded-full bg-[#1c1c1c]"><div className="h-full rounded-full bg-white" style={{ width: Math.min(100, (dlj.received / dlj.total) * 100) + "%" }}></div></div>
                  ) : <div className="bar h-1.5 rounded-full"></div>}
                  <p className="mt-3 text-sm text-neutral-200">Descargando {dlj.label}… <span className="text-neutral-500">{dlj.total ? `${Math.round((dlj.received / dlj.total) * 100)} % · ${mb(dlj.received)} / ${mb(dlj.total)} MB` : `${mb(dlj.received)} MB`}</span></p>
                </>)}
                {dlj.phase === "done" && <p className="text-sm text-neutral-200">Descarga completada. Revisa tu carpeta de descargas.</p>}
                {dlj.phase === "error" && <p className="text-sm text-neutral-200">{dlj.msg}</p>}
                {busy && <div className="mt-3 flex justify-end"><button type="button" onClick={() => ctrl.current?.abort()} className="btn rounded-full border border-neutral-700 px-4 py-1.5 text-xs text-neutral-300 hover:bg-neutral-900">Cancelar</button></div>}
              </div>
            )}
          </div>
        </section>
      )}
    </main>
  );
}

function Compress() {
  return (
    <div className="flex h-[100dvh] flex-col">
      <div className="mx-auto flex w-full max-w-2xl flex-none justify-end px-5 pt-8 pb-3"><a href="#" className="btn inline-block rounded-full border border-neutral-800 px-4 py-2 text-sm text-neutral-300 hover:bg-neutral-900">Volver</a></div>
      <iframe title="Comprimir vídeo" srcDoc={window.COMPRIMIR_HTML} className="w-full min-h-0 flex-1 border-0 bg-[#070707]"></iframe>
    </div>
  );
}

function App() {
  const r = useRoute();
  const app = useInstall();
  useEffect(() => { if (!noBackend) pingServer(); }, []); // lo despierta en segundo plano al abrir la web
  const p = PLATFORMS.find(x => x.id === r);
  return r === "comprimir" ? <Compress /> : p ? <Platform key={p.id} p={p} /> : <Home app={app} />;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
